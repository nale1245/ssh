<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>全国大学数据分析大屏 · P0</title>
<script src="./static/vendor/echarts.min.js"></script>
<style>
  :root {
    --space-1: 4px; --space-2: 8px; --space-3: 16px; --space-4: 24px; --space-5: 32px;
    --bg: oklch(0.14 0.03 258);
    --panel: oklch(0.2 0.04 255 / 0.72);
    --line: oklch(0.8 0.12 210 / 0.18);
    --cyan: oklch(0.84 0.13 205);
    --blue: oklch(0.7 0.16 255);
    --amber: oklch(0.84 0.14 85);
    --violet: oklch(0.78 0.11 295);
    --text: oklch(0.94 0.02 240);
    --muted: oklch(0.7 0.04 245);
    --danger: oklch(0.7 0.19 25);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --font-display: "Bahnschrift", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    --font-body: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    --font-mono: "Cascadia Mono", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 700px at 18% -10%, oklch(0.35 0.12 260 / 0.35), transparent 62%),
      radial-gradient(900px 600px at 96% 0%, oklch(0.55 0.12 205 / 0.18), transparent 58%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(oklch(0.8 0.12 210 / 0.04) 1px, transparent 1px),
      linear-gradient(90deg, oklch(0.8 0.12 210 / 0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }
  .screen {
    position: relative;
    height: 100vh;
    min-height: 720px;
    padding: var(--space-3) var(--space-4) var(--space-2);
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: var(--space-3);
  }
  header {
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-2) var(--space-4);
    border: 1px solid var(--line);
    border-radius: 12px;
    background: linear-gradient(90deg, oklch(0.2 0.05 255 / 0.9), oklch(0.22 0.05 245 / 0.55));
    box-shadow: 0 0 32px oklch(0.84 0.13 205 / 0.07) inset;
  }
  header::after {
    content: "";
    position: absolute; left: var(--space-4); right: var(--space-4); bottom: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0.5;
  }
  .brand { display: flex; align-items: center; gap: var(--space-3); }
  .logo {
    width: 44px; height: 44px; border-radius: 11px;
    display: grid; place-items: center;
    font-family: var(--font-display);
    font-size: 21px; font-weight: 700;
    color: oklch(0.17 0.04 255);
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    box-shadow: 0 0 20px oklch(0.84 0.13 205 / 0.45);
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 3px;
    background: linear-gradient(90deg, oklch(0.97 0.02 220), var(--cyan) 58%, var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand p { margin: var(--space-1) 0 0; font-size: 12px; color: var(--muted); letter-spacing: 1.2px; }
  .kpis { display: flex; gap: var(--space-4); }
  .kpi { position: relative; text-align: center; min-width: 88px; }
  .kpi + .kpi::before {
    content: ""; position: absolute; left: calc(var(--space-4) / -2); top: 4px; bottom: 4px; width: 1px;
    background: linear-gradient(180deg, transparent, oklch(0.8 0.12 210 / 0.25), transparent);
  }
  .kpi b {
    display: block;
    font-family: var(--font-display);
    font-size: 28px; line-height: 1.1;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    text-shadow: 0 0 16px oklch(0.84 0.13 205 / 0.25);
  }
  .kpi.total b { color: var(--cyan); }
  .kpi.l985 b { color: var(--amber); }
  .kpi.l211 b { color: var(--blue); }
  .kpi.prov b { color: var(--violet); }
  .kpi span { font-size: 12px; color: var(--muted); letter-spacing: 1px; }
  .controls { display: flex; justify-content: flex-end; align-items: center; gap: var(--space-2); }
  .controls label { font-size: 13px; color: var(--muted); }
  select, input, button {
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: oklch(0.22 0.04 250 / 0.85);
    border: 1px solid oklch(0.8 0.12 210 / 0.3);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.16s var(--ease), box-shadow 0.2s var(--ease), background 0.2s var(--ease);
  }
  select { padding: var(--space-2) 12px; cursor: pointer; }
  button { padding: var(--space-2) 16px; cursor: pointer; background: oklch(0.28 0.05 220 / 0.55); }
  button:hover { border-color: var(--cyan); box-shadow: 0 0 14px oklch(0.84 0.13 205 / 0.22); }
  button:active { transform: translateY(1px); }
  button.primary {
    color: oklch(0.17 0.04 255);
    font-weight: 600;
    background: linear-gradient(135deg, var(--cyan), oklch(0.78 0.12 225));
    border-color: transparent;
  }
  button.primary:hover { box-shadow: 0 0 18px oklch(0.84 0.13 205 / 0.4); }
  select:focus-visible, input:focus-visible, button:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }
  select:focus, input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px oklch(0.84 0.13 205 / 0.14); }
  main { display: grid; grid-template-columns: 46fr 54fr; gap: var(--space-3); min-height: 0; }
  .panel {
    position: relative;
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 0;
    padding: var(--space-2) var(--space-3) var(--space-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    background: linear-gradient(180deg, oklch(0.22 0.045 252 / 0.78), oklch(0.16 0.035 255 / 0.88));
    box-shadow: 0 18px 40px oklch(0.1 0.03 255 / 0.55), 0 0 24px oklch(0.84 0.13 205 / 0.04) inset;
    transition: border-color 0.2s var(--ease), box-shadow 0.25s var(--ease);
  }
  .panel:hover {
    border-color: oklch(0.8 0.12 210 / 0.34);
    box-shadow: 0 18px 44px oklch(0.1 0.03 255 / 0.6), 0 0 28px oklch(0.84 0.13 205 / 0.08) inset;
  }
  .panel::before, .panel::after {
    content: ""; position: absolute; width: 16px; height: 16px; border: 2px solid var(--cyan);
    opacity: 0.7; pointer-events: none;
  }
  .panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; border-radius: 12px 0 0 0; }
  .panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; border-radius: 0 0 12px 0; }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
    padding-bottom: var(--space-2); border-bottom: 1px solid oklch(0.8 0.12 210 / 0.12);
  }
  .panel-head h2 {
    margin: 0; font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: 1.5px;
    display: flex; align-items: center; gap: var(--space-2);
    white-space: nowrap;
  }
  .panel-head h2::before {
    content: ""; width: 4px; height: 16px; border-radius: 2px;
    background: linear-gradient(180deg, var(--cyan), var(--blue));
    box-shadow: 0 0 10px oklch(0.84 0.13 205 / 0.55);
  }
  .panel-head .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #trendMeta { margin-right: auto; padding-left: var(--space-1); font-variant-numeric: tabular-nums; }
  .chart { position: relative; width: 100%; height: 100%; min-height: 0; }
  .panel.loading .chart { opacity: 0.28; }
  .panel.loading .chart::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 20%, oklch(0.84 0.13 205 / 0.09) 50%, transparent 80%);
    background-size: 220% 100%;
    animation: shimmer 1.4s linear infinite;
    pointer-events: none;
  }
  @keyframes shimmer { from { background-position: 130% 0; } to { background-position: -80% 0; } }
  .hint { font-size: 11px; color: var(--muted); padding: var(--space-1) 2px 0; letter-spacing: 0.4px; }
  .school-search { display: flex; gap: var(--space-2); align-items: center; }
  .school-search input { width: 216px; padding: var(--space-2) 12px; }
  footer {
    display: flex; align-items: center; gap: var(--space-4);
    padding: var(--space-1) var(--space-3);
    font-size: 11px; color: var(--muted);
    border: 1px solid oklch(0.8 0.12 210 / 0.1); border-radius: 8px;
    background: oklch(0.18 0.035 255 / 0.55);
  }
  footer .spacer { flex: 1; }
  .status { display: inline-flex; align-items: center; gap: var(--space-2); }
  .status i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); box-shadow: 0 0 8px currentColor;
    transition: background 0.2s var(--ease);
  }
  .status.ok i { background: oklch(0.78 0.17 150); }
  .status.bad i { background: var(--danger); }
  .toast {
    position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%) translateY(12px);
    padding: 10px 18px; font-size: 13px; border-radius: 8px;
    background: oklch(0.24 0.05 245 / 0.97);
    border: 1px solid oklch(0.8 0.12 210 / 0.4);
    color: var(--text); opacity: 0; pointer-events: none;
    transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
    box-shadow: 0 10px 30px oklch(0.1 0.03 255 / 0.6); z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .error-banner {
    position: fixed; top: var(--space-3); left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: var(--space-3);
    max-width: min(760px, 90vw);
    padding: 10px 16px; border-radius: 8px; font-size: 13px;
    background: oklch(0.3 0.09 25 / 0.95);
    border: 1px solid oklch(0.7 0.19 25 / 0.8);
    color: oklch(0.96 0.02 25);
    box-shadow: 0 10px 30px oklch(0.1 0.03 255 / 0.5);
    z-index: 30;
  }
  .error-banner.show { display: flex; }
  .error-banner button { padding: 4px 12px; font-size: 12px; background: transparent; border-color: currentColor; color: inherit; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (max-width: 1280px) {
    h1 { font-size: 21px; letter-spacing: 2px; }
    .kpis { gap: var(--space-3); }
    .kpi b { font-size: 22px; }
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  }
  </style>
</head>
<body>
<div class="screen" id="screen">
  <header>
    <div class="brand">
      <div class="logo">U</div>
      <div>
        <h1>全国大学数据分析大屏</h1>
        <p>SHANGHAIRANKING · 中国大学排名 · 2021-2026</p>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi total"><b id="kpiTotal">-</b><span>上榜高校</span></div>
      <div class="kpi l985"><b id="kpi985">-</b><span>985 高校</span></div>
      <div class="kpi l211"><b id="kpi211">-</b><span>211 高校</span></div>
      <div class="kpi prov"><b id="kpiProv">-</b><span>覆盖省份</span></div>
    </div>
    <div class="controls">
      <label for="yearSelect">年份</label>
      <select id="yearSelect">
        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2021">2021</option>
      </select>
      <button id="reloadBtn" type="button">刷新数据</button>
    </div>
  </header>

  <main>
    <section class="panel" id="mapPanel">
      <div class="panel-head">
        <h2>全国高校分布</h2>
        <span class="meta" id="mapMeta">省份着色：上榜高校数量</span>
      </div>
      <div class="chart" id="mapChart"></div>
      <div class="hint">悬停查看 985/211 数量；点击省份查看提示（下钻与饼图在阶段 5 开放）</div>
    </section>

    <section class="panel" id="trendPanel">
      <div class="panel-head">
        <h2>排名趋势</h2>
        <span class="meta" id="trendMeta"></span>
        <div class="school-search">
          <input id="schoolInput" list="schoolOptions" placeholder="输入学校名，如 清华大学" autocomplete="off">
          <datalist id="schoolOptions"></datalist>
          <button id="searchBtn" type="button" class="primary">查看趋势</button>
        </div>
      </div>
      <div class="chart" id="trendChart"></div>
      <div class="hint">Y 轴越靠上名次越高；「500+」为软科 500 名之后的档位；底部滑块可缩放/拖动</div>
    </section>
  </main>

  <footer>
    <span class="status" id="healthStatus"><i></i><span id="healthText">正在检查服务…</span></span>
    <span>数据来源：软科中国大学排名（主榜）· 6 个年份 / 600 所高校</span>
    <span class="spacer"></span>
    <span id="clock"></span>
  </footer>
</div>
<div class="toast" id="toast"></div>
<div class="error-banner" id="errorBanner" role="alert"><span id="errorText"></span><button id="retryBtn" type="button">重试</button></div>

<script>
(function () {
  "use strict";

  var API_BASE = location.protocol === "file:" ? "http://127.0.0.1:5000" : "";
  var RANK_PLUS = 1000;
  var state = { year: 2026, school: "清华大学" };
  var mapChart = null;
  var trendChart = null;
  var toastTimer = null;
  var searchTimer = null;
  var mapReady = false;
  var errorTimer = null;
  var retryAction = null;

  function $(id) { return document.getElementById(id); }

  function apiUrl(path, params) {
    var qs = [];
    if (params) {
      Object.keys(params).forEach(function (key) {
        if (params[key] === undefined || params[key] === null || params[key] === "") return;
        qs.push(encodeURIComponent(key) + "=" + encodeURIComponent(params[key]));
      });
    }
    return API_BASE + path + (qs.length ? "?" + qs.join("&") : "");
  }

  function fetchJSON(path, params) {
    return fetch(apiUrl(path, params), { headers: { "Accept": "application/json" } })
      .then(function (resp) {
        return resp.json().catch(function () { return null; });
      })
      .then(function (body) {
        if (!body) throw new Error("网络请求失败，请确认后端服务已启动");
        if (body.code !== 0) throw new Error(body.message || ("code " + body.code));
        return body.data;
      });
  }

  function toast(message) {
    var el = $("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2400);
  }

  function showError(message, retry) {
    $("errorText").textContent = message;
    retryAction = retry || null;
    $("retryBtn").style.display = retry ? "" : "none";
    var el = $("errorBanner");
    el.classList.add("show");
    clearTimeout(errorTimer);
    errorTimer = setTimeout(function () { el.classList.remove("show"); }, 9000);
  }

  function checkHealth() {
    fetchJSON("/api/health")
      .then(function (data) {
        var el = $("healthStatus");
        el.classList.remove("bad");
        el.classList.add("ok");
        $("healthText").textContent = "服务正常 · " + data.database;
      })
      .catch(function () {
        var el = $("healthStatus");
        el.classList.remove("ok");
        el.classList.add("bad");
        $("healthText").textContent = "服务异常 · 请检查后端与 MySQL";
      });
  }

  function setLoading(panelId, loading) {
    var panel = $(panelId);
    if (!panel) return;
    panel.classList.toggle("loading", !!loading);
  }

  function rankText(rank) {
    if (rank === null || rank === undefined) return "-";
    return Number(rank) >= RANK_PLUS ? "500+" : String(rank);
  }

  function debounce(fn, wait) {
    return function () {
      var args = arguments;
      var self = this;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { fn.apply(self, args); }, wait);
    };
  }

  // ------------------------------------------------------------------ 地图
  function initMap(geoJson) {
    echarts.registerMap("china", geoJson);
    mapChart = echarts.init($("mapChart"), null, { renderer: "canvas" });
    mapChart.on("click", function (params) {
      if (!params.name) return;
      var value = params.value;
      if (!value) {
        toast(params.name + "：暂无软科排名数据");
      } else {
        toast(params.name + "：上榜 " + value + " 所（下钻在阶段 5 开放）");
      }
    });
    mapReady = true;
  }

  function loadMap() {
    setLoading("mapPanel", true);
    return fetchJSON("/api/map_data", { year: state.year })
      .then(function (rows) {
        var byName = {};
        var total = 0, c985 = 0, c211 = 0;
        rows.forEach(function (r) {
          byName[r.province] = r;
          total += r.total;
          c985 += r.is985;
          c211 += r.is211;
        });
        var provinces = ["北京","天津","河北","山西","内蒙古","辽宁","吉林","黑龙江",
          "上海","江苏","浙江","安徽","福建","江西","山东","河南","湖北","湖南",
          "广东","广西","海南","重庆","四川","贵州","云南","西藏","陕西","甘肃",
          "青海","宁夏","新疆","台湾","香港","澳门"];
        var values = provinces.map(function (name) {
          return { name: name, value: byName[name] ? byName[name].total : null };
        });
        var maxTotal = rows.reduce(function (m, r) { return Math.max(m, r.total); }, 0);

        $("kpiTotal").textContent = total;
        $("kpi985").textContent = c985;
        $("kpi211").textContent = c211;
        $("kpiProv").textContent = rows.length;
        $("mapMeta").textContent = state.year + " 年 · 省份着色：上榜高校数量";

        mapChart.setOption({
          backgroundColor: "transparent",
          tooltip: {
            trigger: "item",
            backgroundColor: "rgba(6, 20, 42, 0.94)",
            borderColor: "rgba(56, 189, 248, 0.45)",
            textStyle: { color: "#dbeafe", fontSize: 12 },
            formatter: function (p) {
              var d = byName[p.name];
              if (!d) return p.name + "<br/>暂无软科排名数据";
              return "<b>" + p.name + "</b><br/>上榜高校：" + d.total +
                " 所<br/>985：" + d.is985 + " 所<br/>211：" + d.is211 + " 所";
            }
          },
          visualMap: {
            min: 0,
            max: maxTotal || 10,
            left: 12,
            bottom: 12,
            calculable: false,
            itemWidth: 12,
            itemHeight: 120,
            text: ["多", "少"],
            textStyle: { color: "#7c93b5", fontSize: 11 },
            inRange: { color: ["#0b2545", "#12457a", "#1179a8", "#22d3ee"] },
            outOfRange: { color: "rgba(30, 41, 59, 0.55)" }
          },
          series: [{
            type: "map",
            map: "china",
            roam: false,
            zoom: 1.18,
            top: 18,
            bottom: 20,
            label: {
              show: true,
              color: "#a9c7e8",
              fontSize: 10,
              formatter: function (p) { return p.name; }
            },
            labelLayout: { hideOverlap: true },
            itemStyle: {
              areaColor: "#0d2242",
              borderColor: "rgba(56, 189, 248, 0.55)",
              borderWidth: 0.8,
              shadowColor: "rgba(34, 211, 238, 0.25)",
              shadowBlur: 14
            },
            emphasis: {
              label: { show: true, color: "#e0f2fe", fontSize: 12 },
              itemStyle: { areaColor: "#1e6fa8", borderColor: "#67e8f9", borderWidth: 1.2 }
            },
            select: { disabled: true },
            data: values
          }]
        }, true);
      })
      .catch(function (err) {
        showError("地图数据加载失败：" + err.message, loadMap);
      })
      .finally(function () {
        setLoading("mapPanel", false);
      });
  }

  // ------------------------------------------------------------------ 趋势
  var TREND_YEARS = [];

  function loadTrend(school) {
    if (!school) return Promise.resolve();
    setLoading("trendPanel", true);
    return fetchJSON("/api/trend", { school: school })
      .then(function (data) {
        state.school = school;
        TREND_YEARS = data.years;
        var ranks = data.ranks.map(function (r) {
          if (r === null || r === undefined) return null;
          return Number(r) >= RANK_PLUS ? RANK_PLUS : r;
        });
        var scores = data.scores;
        var isPlus = data.ranks.map(function (r) { return r !== null && Number(r) >= RANK_PLUS; });
        var hasPlus = isPlus.some(Boolean);
        var maxRank = ranks.reduce(function (m, v) {
          return v === null ? m : Math.max(m, v);
        }, 1);
        var yMax = hasPlus ? RANK_PLUS : Math.max(5, maxRank + 2);

        var option = {
          backgroundColor: "transparent",
          grid: { left: 58, right: 30, top: 34, bottom: 78 },
          tooltip: {
            trigger: "axis",
            backgroundColor: "rgba(6, 20, 42, 0.94)",
            borderColor: "rgba(56, 189, 248, 0.45)",
            textStyle: { color: "#dbeafe", fontSize: 12 },
            formatter: function (items) {
              if (!items || !items.length) return "";
              var idx = items[0].dataIndex;
              var rank = data.ranks[idx];
              var score = scores[idx];
              return "<b>" + state.school + "</b><br/>" + data.years[idx] +
                " 年<br/>排名：" + rankText(rank) +
                "<br/>总分：" + (score === null || score === undefined ? "-" : score);
            }
          },
          xAxis: {
            type: "category",
            boundaryGap: false,
            data: data.years,
            axisLine: { lineStyle: { color: "rgba(56, 189, 248, 0.35)" } },
            axisLabel: { color: "#9fb3d1", fontSize: 12 },
            axisTick: { show: false }
          },
          yAxis: {
            type: "value",
            inverse: true,
            min: 1,
            max: yMax,
            splitNumber: 5,
            axisLabel: {
              color: "#9fb3d1",
              fontSize: 11,
              showMaxLabel: false,
              formatter: function (value) {
                return value >= RANK_PLUS ? "500+" : value;
              }
            },
            splitLine: { lineStyle: { color: "rgba(56, 189, 248, 0.10)", type: "dashed" } }
          },
          dataZoom: [
            { type: "inside", start: 0, end: 100 },
            {
              type: "slider",
              height: 16,
              bottom: 16,
              start: 0,
              end: 100,
              borderColor: "rgba(56, 189, 248, 0.25)",
              backgroundColor: "rgba(8, 24, 48, 0.6)",
              fillerColor: "rgba(34, 211, 238, 0.18)",
              handleStyle: { color: "#22d3ee", borderColor: "#22d3ee" },
              textStyle: { color: "#7c93b5", fontSize: 10 },
              dataBackground: {
                lineStyle: { color: "rgba(56, 189, 248, 0.35)" },
                areaStyle: { color: "rgba(34, 211, 238, 0.10)" }
              }
            }
          ],
          series: [{
            name: "排名",
            type: "line",
            data: ranks,
            smooth: false,
            symbol: "circle",
            symbolSize: 9,
            lineStyle: { width: 2.4, color: "#22d3ee", shadowColor: "rgba(34, 211, 238, 0.6)", shadowBlur: 12 },
            itemStyle: { color: "#22d3ee", borderColor: "#0b1b33", borderWidth: 2 },
            label: {
              show: true,
              position: "top",
              color: "#9fb3d1",
              fontSize: 10,
              formatter: function (p) {
                return isPlus[p.dataIndex] ? "500+" : "";
              }
            },
            markLine: {
              silent: true,
              symbol: "none",
              show: hasPlus,
              lineStyle: { color: "rgba(148, 163, 184, 0.25)", type: "dashed" },
              label: { color: "#64748b", fontSize: 10 },
              data: [{ yAxis: RANK_PLUS, label: { formatter: "500+" } }]
            }
          }]
        };
        trendChart.setOption(option, true);
        $("trendPanel").querySelector("h2").textContent = "排名趋势 · " + state.school;
        var last = data.years.length - 1;
        $("trendMeta").textContent = data.years[last] + " 年：" +
          "第 " + rankText(data.ranks[last]) + " 名" +
          (scores[last] === null || scores[last] === undefined ? "" : " · 总分 " + scores[last]);
      })
      .catch(function (err) {
        showError("趋势数据加载失败：" + err.message, function () { loadTrend(state.school); });
      })
      .finally(function () {
        setLoading("trendPanel", false);
      });
  }

  // ------------------------------------------------------------------ 搜索
  function loadSchoolOptions(keyword) {
    fetchJSON("/api/schools", { keyword: keyword, limit: 20 })
      .then(function (rows) {
        var list = $("schoolOptions");
        list.innerHTML = "";
        rows.forEach(function (row) {
          var opt = document.createElement("option");
          opt.value = row.name;
          list.appendChild(opt);
        });
      })
      .catch(function () { /* 搜索建议失败不打扰用户 */ });
  }

  function updateUrl() {
    try {
      var url = new URL(location.href);
      url.searchParams.set("year", state.year);
      url.searchParams.set("school", state.school);
      history.replaceState(null, "", url.toString());
    } catch (e) { /* file:// 下忽略 */ }
  }

  function readUrl() {
    try {
      var params = new URLSearchParams(location.search);
      var year = params.get("year");
      var school = params.get("school");
      if (year && /^\d{4}$/.test(year)) {
        state.year = parseInt(year, 10);
        var select = $("yearSelect");
        if (select) {
          Array.prototype.forEach.call(select.options, function (opt) {
            opt.selected = (Number(opt.value) === state.year);
          });
        }
      }
      if (school) state.school = school;
    } catch (e) { /* 忽略 */ }
  }

  // ------------------------------------------------------------------ 初始化
  function bindEvents() {
    $("yearSelect").addEventListener("change", function (e) {
      state.year = parseInt(e.target.value, 10);
      updateUrl();
      loadMap();
    });

    $("reloadBtn").addEventListener("click", function () {
      loadMap();
      loadTrend(state.school);
      toast("已刷新 " + state.year + " 年数据");
    });

    $("searchBtn").addEventListener("click", function () {
      var value = $("schoolInput").value.trim();
      if (!value) { toast("请输入学校名"); return; }
      loadTrend(value).then(updateUrl);
    });

    $("schoolInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        var value = $("schoolInput").value.trim();
        if (value) loadTrend(value).then(updateUrl);
      }
    });

    $("schoolInput").addEventListener("input", debounce(function (e) {
      loadSchoolOptions(e.target.value.trim());
    }, 260));

    $("retryBtn").addEventListener("click", function () {
      $("errorBanner").classList.remove("show");
      checkHealth();
      if (retryAction) retryAction();
    });

    window.addEventListener("resize", debounce(function () {
      if (mapChart) mapChart.resize();
      if (trendChart) trendChart.resize();
    }, 160));
  }

  function tickClock() {
    var now = new Date();
    var pad = function (n) { return String(n).padStart(2, "0"); };
    $("clock").textContent = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) +
      " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
  }

  function boot() {
    readUrl();
    $("schoolInput").value = state.school;
    trendChart = echarts.init($("trendChart"), null, { renderer: "canvas" });

    fetch("./static/vendor/china.json")
      .then(function (resp) { return resp.json(); })
      .then(function (geoJson) {
        initMap(geoJson);
        return Promise.all([loadMap(), loadTrend(state.school)]);
      })
      .then(function () {
        $("schoolInput").value = state.school;
        loadSchoolOptions(state.school);
        updateUrl();
      })
      .catch(function (err) {
        showError("地图资源加载失败：" + err.message + "（请通过 python app.py 访问）");
      });

    bindEvents();
    tickClock();
    setInterval(tickClock, 1000);
    loadSchoolOptions("");
    checkHealth();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
