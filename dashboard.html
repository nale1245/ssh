<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>全国大学数据分析大屏 · P0</title>
<script src="./static/vendor/echarts.min.js"></script>
<style>
  :root {
    --bg: #040914;
    --panel: rgba(10, 22, 45, 0.72);
    --line: rgba(56, 189, 248, 0.22);
    --cyan: #22d3ee;
    --blue: #3b82f6;
    --text: #dbeafe;
    --muted: #7c93b5;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 700px at 20% -10%, rgba(37, 99, 235, 0.28), transparent 60%),
      radial-gradient(900px 600px at 95% 0%, rgba(34, 211, 238, 0.18), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(56, 189, 248, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 189, 248, 0.045) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }
  .screen {
    position: relative;
    height: 100vh;
    min-height: 720px;
    padding: 18px 22px 10px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 14px;
  }
  header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 18px;
    padding: 10px 18px;
    border: 1px solid var(--line);
    background: linear-gradient(90deg, rgba(8, 20, 40, 0.9), rgba(9, 26, 52, 0.6));
    border-radius: 10px;
    box-shadow: 0 0 30px rgba(34, 211, 238, 0.08) inset;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 42px; height: 42px; border-radius: 10px;
    display: grid; place-items: center;
    font-weight: 700; font-size: 20px;
    color: #04101f;
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    box-shadow: 0 0 18px rgba(34, 211, 238, 0.55);
  }
  h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 3px;
    font-weight: 700;
    background: linear-gradient(90deg, #e0f2fe, #38bdf8 55%, #818cf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand p { margin: 3px 0 0; font-size: 12px; color: var(--muted); letter-spacing: 1px; }
  .kpis { display: flex; gap: 26px; }
  .kpi { text-align: center; min-width: 84px; }
  .kpi b {
    display: block; font-size: 24px; line-height: 1.15;
    color: var(--cyan); font-family: Consolas, "Segoe UI", monospace;
    text-shadow: 0 0 14px rgba(34, 211, 238, 0.45);
  }
  .kpi span { font-size: 12px; color: var(--muted); letter-spacing: 1px; }
  .controls { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
  .controls label { font-size: 13px; color: var(--muted); }
  select, input, button {
    font-family: inherit;
    color: var(--text);
    background: rgba(8, 24, 48, 0.9);
    border: 1px solid rgba(56, 189, 248, 0.35);
    border-radius: 7px;
    outline: none;
  }
  select { padding: 8px 12px; font-size: 14px; cursor: pointer; }
  select:focus, input:focus { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.18); }
  button {
    padding: 8px 16px; font-size: 13px; cursor: pointer;
    background: linear-gradient(135deg, rgba(34, 211, 238, 0.22), rgba(59, 130, 246, 0.28));
    transition: 0.18s;
  }
  button:hover { border-color: var(--cyan); box-shadow: 0 0 14px rgba(34, 211, 238, 0.25); }
  main { display: grid; grid-template-columns: 46fr 54fr; gap: 14px; min-height: 0; }
  .panel {
    position: relative;
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 0;
    padding: 12px 14px 8px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(10, 24, 48, 0.78), rgba(5, 14, 30, 0.85));
    box-shadow: 0 0 40px rgba(2, 6, 23, 0.7), 0 0 24px rgba(34, 211, 238, 0.05) inset;
  }
  .panel::before, .panel::after {
    content: ""; position: absolute; width: 16px; height: 16px; border: 2px solid var(--cyan);
    opacity: 0.75;
  }
  .panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; border-radius: 10px 0 0 0; }
  .panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; border-radius: 0 0 10px 0; }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding-bottom: 8px; border-bottom: 1px solid rgba(56, 189, 248, 0.14);
  }
  .panel-head h2 {
    margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 2px;
    display: flex; align-items: center; gap: 8px;
  }
  .panel-head h2::before {
    content: ""; width: 4px; height: 15px; border-radius: 2px;
    background: linear-gradient(180deg, var(--cyan), var(--blue));
    box-shadow: 0 0 10px rgba(34, 211, 238, 0.6);
  }
  .panel-head .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chart { width: 100%; height: 100%; min-height: 0; }
  .hint { font-size: 11px; color: var(--muted); padding: 4px 2px 0; letter-spacing: 0.5px; }
  #trendMeta { margin-right: auto; padding-left: 4px; }
  .school-search { display: flex; gap: 8px; align-items: center; }
  .school-search input { width: 220px; padding: 8px 12px; font-size: 13px; }
  footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 16px; font-size: 11px; color: var(--muted);
    border: 1px solid rgba(56, 189, 248, 0.12); border-radius: 8px;
    background: rgba(6, 16, 34, 0.6);
  }
  .toast {
    position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%) translateY(16px);
    padding: 10px 18px; font-size: 13px; border-radius: 8px;
    background: rgba(8, 30, 60, 0.96); border: 1px solid rgba(56, 189, 248, 0.45);
    color: var(--text); opacity: 0; pointer-events: none; transition: 0.22s;
    box-shadow: 0 8px 28px rgba(2, 6, 23, 0.6); z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .error-banner {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    padding: 8px 16px; border-radius: 8px; font-size: 13px;
    background: rgba(127, 29, 29, 0.92); border: 1px solid var(--danger);
    display: none; z-index: 30;
  }
  .error-banner.show { display: block; }
  .loading .chart { opacity: 0.35; transition: 0.2s; }
  @media (max-width: 1280px) {
    h1 { font-size: 20px; letter-spacing: 2px; }
    .kpis { gap: 14px; }
    .kpi b { font-size: 19px; }
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="screen" id="screen">
  <header>
    <div class="brand">
      <div class="logo">U</div>
      <div>
        <h1>全国大学数据分析大屏</h1>
        <p>SHANGHAIRANKING · 中国大学排名 · 2021-2026</p>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><b id="kpiTotal">-</b><span>上榜高校</span></div>
      <div class="kpi"><b id="kpi985">-</b><span>985 高校</span></div>
      <div class="kpi"><b id="kpi211">-</b><span>211 高校</span></div>
      <div class="kpi"><b id="kpiProv">-</b><span>覆盖省份</span></div>
    </div>
    <div class="controls">
      <label for="yearSelect">年份</label>
      <select id="yearSelect">
        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2021">2021</option>
      </select>
      <button id="reloadBtn" type="button">刷新</button>
    </div>
  </header>

  <main>
    <section class="panel" id="mapPanel">
      <div class="panel-head">
        <h2>全国高校分布</h2>
        <span class="meta" id="mapMeta">省份着色：上榜高校数量</span>
      </div>
      <div class="chart" id="mapChart"></div>
      <div class="hint">悬停查看 985/211 数量；点击省份查看提示（下钻与饼图在阶段 5 开放）</div>
    </section>

    <section class="panel" id="trendPanel">
      <div class="panel-head">
        <h2>排名趋势</h2>
        <span class="meta" id="trendMeta"></span>
        <div class="school-search">
          <input id="schoolInput" list="schoolOptions" placeholder="输入学校名，如 清华大学" autocomplete="off">
          <datalist id="schoolOptions"></datalist>
          <button id="searchBtn" type="button">查询</button>
        </div>
      </div>
      <div class="chart" id="trendChart"></div>
      <div class="hint">Y 轴越靠上名次越高；「500+」为软科 500 名之后的档位；底部滑块可缩放/拖动</div>
    </section>
  </main>

  <footer>
    <span>数据来源：软科中国大学排名（主榜）· MySQL 5.7 · 6 个年份 / 600 所高校</span>
    <span id="clock"></span>
  </footer>
</div>
<div class="toast" id="toast"></div>
<div class="error-banner" id="errorBanner"></div>

<script>
(function () {
  "use strict";

  var API_BASE = location.protocol === "file:" ? "http://127.0.0.1:5000" : "";
  var RANK_PLUS = 1000;
  var state = { year: 2026, school: "清华大学" };
  var mapChart = null;
  var trendChart = null;
  var toastTimer = null;
  var searchTimer = null;
  var mapReady = false;

  function $(id) { return document.getElementById(id); }

  function apiUrl(path, params) {
    var qs = [];
    if (params) {
      Object.keys(params).forEach(function (key) {
        if (params[key] === undefined || params[key] === null || params[key] === "") return;
        qs.push(encodeURIComponent(key) + "=" + encodeURIComponent(params[key]));
      });
    }
    return API_BASE + path + (qs.length ? "?" + qs.join("&") : "");
  }

  function fetchJSON(path, params) {
    return fetch(apiUrl(path, params), { headers: { "Accept": "application/json" } })
      .then(function (resp) {
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        return resp.json();
      })
      .then(function (body) {
        if (body.code !== 0) throw new Error(body.message || ("code " + body.code));
        return body.data;
      });
  }

  function toast(message) {
    var el = $("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2400);
  }

  function showError(message) {
    var el = $("errorBanner");
    el.textContent = message;
    el.classList.add("show");
    setTimeout(function () { el.classList.remove("show"); }, 5000);
  }

  function setLoading(panelId, loading) {
    var panel = $(panelId);
    if (!panel) return;
    panel.classList.toggle("loading", !!loading);
  }

  function rankText(rank) {
    if (rank === null || rank === undefined) return "-";
    return Number(rank) >= RANK_PLUS ? "500+" : String(rank);
  }

  function debounce(fn, wait) {
    return function () {
      var args = arguments;
      var self = this;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { fn.apply(self, args); }, wait);
    };
  }

  // ------------------------------------------------------------------ 地图
  function initMap(geoJson) {
    echarts.registerMap("china", geoJson);
    mapChart = echarts.init($("mapChart"), null, { renderer: "canvas" });
    mapChart.on("click", function (params) {
      if (!params.name) return;
      var value = params.value;
      if (!value) {
        toast(params.name + "：暂无软科排名数据");
      } else {
        toast(params.name + "：上榜 " + value + " 所（下钻在阶段 5 开放）");
      }
    });
    mapReady = true;
  }

  function loadMap() {
    setLoading("mapPanel", true);
    return fetchJSON("/api/map_data", { year: state.year })
      .then(function (rows) {
        var byName = {};
        var total = 0, c985 = 0, c211 = 0;
        rows.forEach(function (r) {
          byName[r.province] = r;
          total += r.total;
          c985 += r.is985;
          c211 += r.is211;
        });
        var provinces = ["北京","天津","河北","山西","内蒙古","辽宁","吉林","黑龙江",
          "上海","江苏","浙江","安徽","福建","江西","山东","河南","湖北","湖南",
          "广东","广西","海南","重庆","四川","贵州","云南","西藏","陕西","甘肃",
          "青海","宁夏","新疆","台湾","香港","澳门"];
        var values = provinces.map(function (name) {
          return { name: name, value: byName[name] ? byName[name].total : null };
        });
        var maxTotal = rows.reduce(function (m, r) { return Math.max(m, r.total); }, 0);

        $("kpiTotal").textContent = total;
        $("kpi985").textContent = c985;
        $("kpi211").textContent = c211;
        $("kpiProv").textContent = rows.length;
        $("mapMeta").textContent = state.year + " 年 · 省份着色：上榜高校数量";

        mapChart.setOption({
          backgroundColor: "transparent",
          tooltip: {
            trigger: "item",
            backgroundColor: "rgba(6, 20, 42, 0.94)",
            borderColor: "rgba(56, 189, 248, 0.45)",
            textStyle: { color: "#dbeafe", fontSize: 12 },
            formatter: function (p) {
              var d = byName[p.name];
              if (!d) return p.name + "<br/>暂无软科排名数据";
              return "<b>" + p.name + "</b><br/>上榜高校：" + d.total +
                " 所<br/>985：" + d.is985 + " 所<br/>211：" + d.is211 + " 所";
            }
          },
          visualMap: {
            min: 0,
            max: maxTotal || 10,
            left: 12,
            bottom: 12,
            calculable: false,
            itemWidth: 12,
            itemHeight: 120,
            text: ["多", "少"],
            textStyle: { color: "#7c93b5", fontSize: 11 },
            inRange: { color: ["#0b2545", "#12457a", "#1179a8", "#22d3ee"] },
            outOfRange: { color: "rgba(30, 41, 59, 0.55)" }
          },
          series: [{
            type: "map",
            map: "china",
            roam: false,
            zoom: 1.18,
            top: 18,
            bottom: 20,
            label: {
              show: true,
              color: "#a9c7e8",
              fontSize: 10,
              formatter: function (p) { return p.name; }
            },
            labelLayout: { hideOverlap: true },
            itemStyle: {
              areaColor: "#0d2242",
              borderColor: "rgba(56, 189, 248, 0.55)",
              borderWidth: 0.8,
              shadowColor: "rgba(34, 211, 238, 0.25)",
              shadowBlur: 14
            },
            emphasis: {
              label: { show: true, color: "#e0f2fe", fontSize: 12 },
              itemStyle: { areaColor: "#1e6fa8", borderColor: "#67e8f9", borderWidth: 1.2 }
            },
            select: { disabled: true },
            data: values
          }]
        }, true);
      })
      .catch(function (err) {
        showError("地图数据加载失败：" + err.message);
      })
      .finally(function () {
        setLoading("mapPanel", false);
      });
  }

  // ------------------------------------------------------------------ 趋势
  var TREND_YEARS = [];

  function loadTrend(school) {
    if (!school) return Promise.resolve();
    setLoading("trendPanel", true);
    return fetchJSON("/api/trend", { school: school })
      .then(function (data) {
        state.school = school;
        TREND_YEARS = data.years;
        var ranks = data.ranks.map(function (r) {
          if (r === null || r === undefined) return null;
          return Number(r) >= RANK_PLUS ? RANK_PLUS : r;
        });
        var scores = data.scores;
        var isPlus = data.ranks.map(function (r) { return r !== null && Number(r) >= RANK_PLUS; });
        var hasPlus = isPlus.some(Boolean);
        var maxRank = ranks.reduce(function (m, v) {
          return v === null ? m : Math.max(m, v);
        }, 1);
        var yMax = hasPlus ? RANK_PLUS : Math.max(10, Math.ceil(maxRank * 1.15));

        var option = {
          backgroundColor: "transparent",
          grid: { left: 58, right: 30, top: 34, bottom: 78 },
          tooltip: {
            trigger: "axis",
            backgroundColor: "rgba(6, 20, 42, 0.94)",
            borderColor: "rgba(56, 189, 248, 0.45)",
            textStyle: { color: "#dbeafe", fontSize: 12 },
            formatter: function (items) {
              if (!items || !items.length) return "";
              var idx = items[0].dataIndex;
              var rank = data.ranks[idx];
              var score = scores[idx];
              return "<b>" + state.school + "</b><br/>" + data.years[idx] +
                " 年<br/>排名：" + rankText(rank) +
                "<br/>总分：" + (score === null || score === undefined ? "-" : score);
            }
          },
          xAxis: {
            type: "category",
            boundaryGap: false,
            data: data.years,
            axisLine: { lineStyle: { color: "rgba(56, 189, 248, 0.35)" } },
            axisLabel: { color: "#9fb3d1", fontSize: 12 },
            axisTick: { show: false }
          },
          yAxis: {
            type: "value",
            inverse: true,
            min: 1,
            max: yMax,
            splitNumber: 5,
            axisLabel: {
              color: "#9fb3d1",
              fontSize: 11,
              formatter: function (value) {
                return value >= RANK_PLUS ? "500+" : value;
              }
            },
            splitLine: { lineStyle: { color: "rgba(56, 189, 248, 0.10)", type: "dashed" } }
          },
          dataZoom: [
            { type: "inside", start: 0, end: 100 },
            {
              type: "slider",
              height: 16,
              bottom: 16,
              start: 0,
              end: 100,
              borderColor: "rgba(56, 189, 248, 0.25)",
              backgroundColor: "rgba(8, 24, 48, 0.6)",
              fillerColor: "rgba(34, 211, 238, 0.18)",
              handleStyle: { color: "#22d3ee", borderColor: "#22d3ee" },
              textStyle: { color: "#7c93b5", fontSize: 10 },
              dataBackground: {
                lineStyle: { color: "rgba(56, 189, 248, 0.35)" },
                areaStyle: { color: "rgba(34, 211, 238, 0.10)" }
              }
            }
          ],
          series: [{
            name: "排名",
            type: "line",
            data: ranks,
            smooth: false,
            symbol: "circle",
            symbolSize: 9,
            lineStyle: { width: 2.4, color: "#22d3ee", shadowColor: "rgba(34, 211, 238, 0.6)", shadowBlur: 12 },
            itemStyle: { color: "#22d3ee", borderColor: "#0b1b33", borderWidth: 2 },
            label: {
              show: true,
              position: "top",
              color: "#9fb3d1",
              fontSize: 10,
              formatter: function (p) {
                return isPlus[p.dataIndex] ? "500+" : "";
              }
            },
            markLine: {
              silent: true,
              symbol: "none",
              show: hasPlus,
              lineStyle: { color: "rgba(148, 163, 184, 0.25)", type: "dashed" },
              label: { color: "#64748b", fontSize: 10 },
              data: [{ yAxis: RANK_PLUS, label: { formatter: "500+" } }]
            }
          }]
        };
        trendChart.setOption(option, true);
        $("trendPanel").querySelector("h2").textContent = "排名趋势 · " + state.school;
        var last = data.years.length - 1;
        $("trendMeta").textContent = data.years[last] + " 年：" +
          "第 " + rankText(data.ranks[last]) + " 名" +
          (scores[last] === null || scores[last] === undefined ? "" : " · 总分 " + scores[last]);
      })
      .catch(function (err) {
        showError("趋势数据加载失败：" + err.message);
      })
      .finally(function () {
        setLoading("trendPanel", false);
      });
  }

  // ------------------------------------------------------------------ 搜索
  function loadSchoolOptions(keyword) {
    fetchJSON("/api/schools", { keyword: keyword, limit: 20 })
      .then(function (rows) {
        var list = $("schoolOptions");
        list.innerHTML = "";
        rows.forEach(function (row) {
          var opt = document.createElement("option");
          opt.value = row.name;
          list.appendChild(opt);
        });
      })
      .catch(function () { /* 搜索建议失败不打扰用户 */ });
  }

  function updateUrl() {
    try {
      var url = new URL(location.href);
      url.searchParams.set("year", state.year);
      url.searchParams.set("school", state.school);
      history.replaceState(null, "", url.toString());
    } catch (e) { /* file:// 下忽略 */ }
  }

  function readUrl() {
    try {
      var params = new URLSearchParams(location.search);
      var year = params.get("year");
      var school = params.get("school");
      if (year && /^\d{4}$/.test(year)) {
        state.year = parseInt(year, 10);
        var select = $("yearSelect");
        if (select) {
          Array.prototype.forEach.call(select.options, function (opt) {
            opt.selected = (Number(opt.value) === state.year);
          });
        }
      }
      if (school) state.school = school;
    } catch (e) { /* 忽略 */ }
  }

  // ------------------------------------------------------------------ 初始化
  function bindEvents() {
    $("yearSelect").addEventListener("change", function (e) {
      state.year = parseInt(e.target.value, 10);
      updateUrl();
      loadMap();
    });

    $("reloadBtn").addEventListener("click", function () {
      loadMap();
      loadTrend(state.school);
      toast("已刷新 " + state.year + " 年数据");
    });

    $("searchBtn").addEventListener("click", function () {
      var value = $("schoolInput").value.trim();
      if (!value) { toast("请输入学校名"); return; }
      loadTrend(value).then(updateUrl);
    });

    $("schoolInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        var value = $("schoolInput").value.trim();
        if (value) loadTrend(value).then(updateUrl);
      }
    });

    $("schoolInput").addEventListener("input", debounce(function (e) {
      loadSchoolOptions(e.target.value.trim());
    }, 260));

    window.addEventListener("resize", debounce(function () {
      if (mapChart) mapChart.resize();
      if (trendChart) trendChart.resize();
    }, 160));
  }

  function tickClock() {
    var now = new Date();
    var pad = function (n) { return String(n).padStart(2, "0"); };
    $("clock").textContent = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) +
      " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
  }

  function boot() {
    readUrl();
    $("schoolInput").value = state.school;
    trendChart = echarts.init($("trendChart"), null, { renderer: "canvas" });

    fetch("./static/vendor/china.json")
      .then(function (resp) { return resp.json(); })
      .then(function (geoJson) {
        initMap(geoJson);
        return Promise.all([loadMap(), loadTrend(state.school)]);
      })
      .then(function () {
        $("schoolInput").value = state.school;
        loadSchoolOptions(state.school);
        updateUrl();
      })
      .catch(function (err) {
        showError("地图资源加载失败：" + err.message + "（请通过 python app.py 访问）");
      });

    bindEvents();
    tickClock();
    setInterval(tickClock, 1000);
    loadSchoolOptions("");
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
